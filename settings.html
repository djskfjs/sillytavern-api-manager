<!-- A collapsible account console below SillyTavern's available models. -->
<details id="st-api-account-manager" class="sam-panel" aria-labelledby="sam-title">
  <summary class="sam-header">
    <span class="sam-brand-mark" aria-hidden="true">
      API
    </span>
    <span class="sam-header-text">
      <span id="sam-title" class="sam-title">API 账户管理</span>
      <span class="sam-header-meta">
        <span id="sam-account-count">已保存 0 个</span>
        <span aria-hidden="true">·</span>
        <span>v1.8.10</span>
      </span>
    </span>
    <span class="sam-header-chevron fa-solid fa-chevron-down" aria-hidden="true"></span>
  </summary>

  <div class="sam-content">
    <section class="sam-account-section" aria-label="账户列表">
      <div class="sam-section-heading">
        <div class="sam-subheading sam-accounts-heading" role="heading" aria-level="4">
          <button id="sam-accounts-toggle" class="sam-accounts-toggle" type="button" aria-expanded="true" aria-controls="sam-accounts-content">
            <span class="sam-section-title">我的账户</span>
            <svg class="sam-section-chevron" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="m4 6 4 4 4-4" /></svg>
          </button>
        </div>
        <div class="sam-list-toolbar-actions">
          <button id="sam-group-rename-start" class="menu_button sam-button sam-button-small sam-group-rename-start" type="button" aria-controls="sam-group-rename-editor" aria-expanded="false" hidden>
            <span>重命名</span>
          </button>
          <button id="sam-refresh-all" class="menu_button sam-button sam-button-small" type="button" aria-label="刷新全部余额" title="刷新全部余额">
            <i class="fa-solid fa-rotate" aria-hidden="true"></i><span>刷新余额</span>
          </button>
        </div>
      </div>
      <div id="sam-accounts-content">
        <div class="sam-list-toolbar">
          <div class="sam-search-wrap">
            <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
            <input id="sam-account-search" class="text_pole sam-control" type="search" placeholder="搜索站点名称" aria-label="搜索站点名称" aria-controls="sam-account-list" autocomplete="off" spellcheck="false" />
          </div>
          <span id="sam-search-feedback" class="sam-visually-hidden" role="status" aria-live="polite" aria-atomic="true"></span>
          <div id="sam-account-filters" class="sam-account-filters" role="group" aria-label="账户视图">
            <button id="sam-filter-all" class="sam-filter-button" type="button" data-filter="all" aria-pressed="true" aria-controls="sam-account-list sam-failover-section">
              <span>全部 0</span>
            </button>
            <button id="sam-filter-favorites" class="sam-filter-button" type="button" data-filter="favorites" aria-pressed="false" aria-controls="sam-account-list sam-failover-section">
              <i class="fa-solid fa-star" aria-hidden="true"></i><span>收藏 0</span>
            </button>
            <div id="sam-group-filter-buttons" class="sam-group-button-track sam-group-filter-buttons" role="group" aria-label="已保存分组"></div>
          </div>
        </div>

        <div id="sam-group-rename-editor" class="sam-group-rename-editor" role="group" aria-label="重命名当前分组" hidden>
          <label class="sam-visually-hidden" for="sam-group-rename-input">新的分组名称</label>
          <input id="sam-group-rename-input" class="text_pole sam-control" type="text" maxlength="60" placeholder="新的分组名称" autocomplete="off" />
          <button id="sam-group-rename-confirm" class="menu_button sam-button sam-button-small sam-button-primary" type="button">确认</button>
          <button id="sam-group-rename-cancel" class="menu_button sam-button sam-button-small" type="button">取消</button>
        </div>

        <section id="sam-failover-section" class="sam-failover-section" aria-label="当前分组的轮询" hidden>
          <div class="sam-section-heading"><div class="sam-subheading" role="heading" aria-level="4">轮询</div><span>生成失败时启用备用 API</span></div>
          <div class="sam-polling-tools">
            <span class="sam-runtime-state">
              <span class="sam-status-dot" aria-hidden="true"></span>
              <span id="sam-current-group">轮询范围：未选择</span>
            </span>
            <button id="sam-toggle-polling" class="menu_button sam-button sam-button-small" type="button" aria-pressed="false" disabled>
              <i class="fa-solid fa-shuffle" aria-hidden="true"></i><span>开启轮询</span>
            </button>
          </div>
          <p class="sam-polling-hint">正常时保持当前 API；报错后切换，请点击重新生成。可在站点卡片中停止或恢复轮询。</p>
        </section>

        <div class="sam-sort-row">
          <label for="sam-account-sort">排序</label>
          <select id="sam-account-sort" class="text_pole sam-control" aria-controls="sam-account-list">
            <option value="name">按名字排序</option>
            <option value="added">按添加顺序排序</option>
          </select>
        </div>

        <div id="sam-account-list" class="sam-account-list" role="list" aria-label="已保存的 API">
          <div class="sam-empty">还没有保存的 API。</div>
        </div>

        <div class="sam-automation-row" aria-label="自动化设置">
          <label class="sam-switch-row" for="sam-auto-refresh">
            <input id="sam-auto-refresh" type="checkbox" />
            <span class="sam-switch-track" aria-hidden="true"></span>
            <span>自动刷新余额</span>
          </label>
          <label class="sam-interval-row" for="sam-refresh-interval">
            <span>余额</span>
            <input id="sam-refresh-interval" class="text_pole sam-control sam-number" type="number" min="1" max="1440" step="1" value="30" inputmode="numeric" aria-label="余额刷新间隔（分钟）" />
            <span>分钟</span>
          </label>
        </div>
      </div>
    </section>

    <details id="sam-editor" class="sam-editor" open>
      <summary class="sam-editor-summary">
        <span id="sam-form-title" class="sam-section-title">添加 API</span>
        <svg class="sam-section-chevron" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="m4 6 4 4 4-4" /></svg>
      </summary>

      <form id="sam-account-form" class="sam-form" autocomplete="off">
        <div class="sam-form-heading-actions">
          <button id="sam-delete-account" class="menu_button sam-icon-button sam-button-danger" type="button" aria-label="删除账户" title="删除账户" hidden>
            <i class="fa-solid fa-trash-can" aria-hidden="true"></i>
          </button>
          <button id="sam-cancel-edit" class="menu_button sam-icon-button" type="button" aria-label="取消编辑" title="取消编辑" hidden>
            <i class="fa-solid fa-xmark" aria-hidden="true"></i>
          </button>
        </div>
        <input id="sam-account-id" name="accountId" type="hidden" />

      <div class="sam-field-grid">
        <div class="sam-field">
          <label for="sam-name">账户名称 *</label>
          <input id="sam-name" name="name" class="text_pole sam-control" type="text" required maxlength="80" placeholder="常用中转站" />
        </div>
        <div class="sam-field">
          <label for="sam-group">分组</label>
          <div class="sam-group-editor">
            <input id="sam-group" name="group" class="text_pole sam-control" type="text" maxlength="60" placeholder="输入分组名称" autocomplete="off" />
            <div id="sam-group-choices" class="sam-group-button-track sam-group-choices" role="group" aria-label="选择已有分组"></div>
          </div>
        </div>
      </div>

      <div class="sam-field">
        <label for="sam-base-url">API 基础地址 *</label>
        <input id="sam-base-url" name="baseUrl" class="text_pole sam-control" type="url" required placeholder="https://api.example.com" spellcheck="false" />
      </div>

      <div class="sam-field">
        <label for="sam-api-key">API Key *</label>
        <div class="sam-secret-wrap">
          <input id="sam-api-key" name="apiKey" class="text_pole sam-control" type="password" required placeholder="sk-…" spellcheck="false" autocomplete="new-password" />
          <button id="sam-key-toggle" class="menu_button sam-button sam-key-button" type="button" aria-label="显示 API Key" aria-pressed="false" title="显示或隐藏 API Key">
            <i class="fa-solid fa-eye" aria-hidden="true"></i><span>显示</span>
          </button>
        </div>
        <p class="sam-help">编辑时留空即保留当前 Key。</p>
      </div>

      <div class="sam-field">
        <label for="sam-model-select">默认模型</label>
        <div class="sam-model-controls">
          <select id="sam-model-select" name="model" class="text_pole sam-control">
            <option value="">请先获取模型</option>
          </select>
          <button id="sam-fetch-models" class="menu_button sam-button sam-button-small" type="button">
            <i class="fa-solid fa-cloud-arrow-down" aria-hidden="true"></i><span>获取模型</span>
          </button>
        </div>
      </div>

      <div id="sam-balance-settings" class="sam-balance-settings">
        <div class="sam-field">
          <label for="sam-balance-mode">站点余额查询</label>
          <select id="sam-balance-mode" class="text_pole sam-control" aria-describedby="sam-balance-mode-help">
            <option value="account" selected>网站账户（中转站）</option>
            <option value="auto">自动识别账户余额接口</option>
          </select>
          <p id="sam-balance-mode-help" class="sam-help">网站账户模式填写令牌和用户 ID 后，保存时自动查询余额。</p>
        </div>
        <div id="sam-balance-account-fields">
          <div class="sam-field">
            <label for="sam-balance-access-token">网站账户访问令牌</label>
            <input id="sam-balance-access-token" class="text_pole sam-control" type="password" autocomplete="new-password" spellcheck="false" placeholder="在网站个人设置中获取" aria-describedby="sam-balance-token-help" />
            <p id="sam-balance-token-help" class="sam-help">在网站的个人设置中生成访问令牌。这里需要账户访问令牌，聊天 API Key 不能代替它。编辑时留空保留已保存的令牌。</p>
          </div>
          <div class="sam-field">
            <label for="sam-balance-user-id">网站用户 ID</label>
            <input id="sam-balance-user-id" class="text_pole sam-control" type="text" inputmode="numeric" pattern="[1-9][0-9]*" autocomplete="off" placeholder="例如：123" aria-describedby="sam-balance-user-help" />
            <p id="sam-balance-user-help" class="sam-help">在网站个人资料中查看；New API 站点通常需要填写。</p>
          </div>
          <label id="sam-balance-clear-row" class="sam-balance-clear-row" hidden>
            <input id="sam-clear-balance-token" type="checkbox" />
            <span>清除已保存的账户访问令牌</span>
          </label>
        </div>
      </div>

      <div class="sam-form-balance">
        <output id="sam-form-balance" class="sam-account-balance" aria-live="polite">账户余额：填写网站令牌后，保存时自动查询</output>
        <button id="sam-fetch-balance" class="menu_button sam-button sam-button-small" type="button" disabled>
          <i class="fa-solid fa-wallet" aria-hidden="true"></i><span>查询余额</span>
        </button>
      </div>

        <div class="sam-form-actions">
          <button id="sam-save-account" class="menu_button sam-button sam-button-primary" type="submit">
            <i class="fa-solid fa-floppy-disk" aria-hidden="true"></i><span>保存 API</span>
          </button>
        </div>
      </form>
    </details>

  </div>
</details>
